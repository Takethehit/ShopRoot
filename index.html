<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EEFB">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>ShopRoot</title>
<style>
:root{--bg:#F4EEFB;--grape:#4A2370;--green:#16A34A;--muted:#7a6a8a;--red:#DC2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--grape);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.avatar,.gear{width:46px;height:46px;border-radius:50%;border:0;font-size:20px;font-weight:700;display:grid;place-items:center}
.avatar{background:var(--grape);color:#fff}
.gear{background:#fff;box-shadow:0 2px 8px #4a237022}
.brand{flex:1;font-size:20px;font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green)}
.dot.off{background:var(--red)}
main{flex:1;overflow-y:auto;padding:8px 16px 24px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 14px #4a23701a;margin-bottom:14px}
.card>b{display:block;margin-bottom:10px}
input{width:100%;height:52px;border-radius:16px;border:2px solid #d9c8ee;padding:0 16px;font-size:17px;background:#fff;color:var(--grape);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 14px #4a23701a;text-align:center}
.emoji{font-size:44px}
.tile b{display:block;margin-top:4px}
.tile span{color:var(--muted);font-size:14px}
.btn{width:100%;min-height:56px;border:0;border-radius:16px;font-size:17px;font-weight:700;color:#fff;background:var(--grape);box-shadow:0 4px 12px #4a237040}
.btn:active{transform:scale(.97)}
.btn.green{background:var(--green);margin-top:8px;box-shadow:0 4px 12px #16a34a40}
.btn:disabled{opacity:.45}
nav{display:flex;background:#fff;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #4a237020}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:24px;padding:2px 16px;border-radius:14px}
nav button.on{color:var(--grape)}
nav button.on i{background:#e7d8f7}
</style>
</head>
<body>
<header>
<button class="avatar" id="av" onclick="go('profile')">S</button>
<div class="brand">ShopRoot</div>
<div class="dot" id="dot"></div>
<button class="gear" onclick="go('settings')">⚙️</button>
</header>
<main id="screen"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const store={
get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},
set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const products=[["🍚","Rice 1kg","₦2,500"],["🛢️","Vegetable Oil 1L","₦3,000"],["🥚","Eggs (Tray)","₦5,000"],["🍝","Spaghetti 500g","₦1,200"],["🍅","Tomato 1kg","₦1,200"],["🧅","Onion 1kg","₦1,000"]];
const tabs=[["dash","🏠","Dashboard"],["sell","🛒","Sell"],["stock","📦","Stock"],["hist","🧾","History"],["money","💰","Money"]];
let current="sell",order=0;
const shop=()=>store.get("shopName","My Shop");
function tiles(q){
return products.filter(p=>p[1].toLowerCase().includes(q)).map(p=>`<div class="tile"><div class="emoji">${p[0]}</div><b>${p[1]}</b><span>${p[2]}</span><button class="btn green" onclick="add()">+ Add</button></div>`).join("")||"<p class='sub'>No product found</p>";
}
function add(){order++;$("#oc").textContent=order+(order===1?" item":" items");$("#paybtn").disabled=false}
function filter(){$("#grid").innerHTML=tiles($("#q").value.toLowerCase())}
function pay(){alert("Payment comes in the next piece.")}
function saveShop(){store.set("shopName",$("#sn").value.trim()||"My Shop");alert("Saved");render()}
const info=(t,s)=>`<h1>${t}</h1><div class="card"><p class="sub">${s}</p></div>`;
const screens={
dash:()=>`<h1>Good day 👋</h1><p class="sub">${shop()}</p><div class="card"><p class="sub">Weather, sales chart and stock alerts come in later pieces.</p></div>`,
sell:()=>`<h1>New Sale</h1><p class="sub">Find products and add them to the customer’s order.</p><input id="q" placeholder="Search products..." oninput="filter()"><div class="grid" id="grid">${tiles("")}</div><div class="card" style="margin-top:14px"><b id="oc">${order} items</b><button class="btn" id="paybtn" onclick="pay()" ${order?"":"disabled"}>Proceed to Payment</button></div>`,
stock:()=>info("Stock","Items, products, recipes and low-stock alerts come in later pieces."),
hist:()=>info("History","Sales, receipts and verification come in later pieces."),
money:()=>info("Money","Expenses and reports come in later pieces."),
profile:()=>info("Profile","Shop: "+shop()+"<br>Role: Owner"),
settings:()=>`<h1>Settings</h1><div class="card"><b>Shop name</b><input id="sn" value="${shop().replace(/"/g,"&quot;")}"><button class="btn green" onclick="saveShop()">Save</button></div>`
};
function go(t){current=t;render()}
function render(){
$("#screen").innerHTML=screens[current]();
$("#nav").innerHTML=tabs.map(t=>`<button class="${t[0]===current?"on":""}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join("");
$("#av").textContent=shop().charAt(0).toUpperCase();
$("#screen").scrollTop=0;
}
function net(){$("#dot").className="dot"+(navigator.onLine?"":" off")}
addEventListener("online",net);addEventListener("offline",net);
net();render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}
</script>
</body>
</html>
